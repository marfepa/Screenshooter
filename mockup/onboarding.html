  /* ==========================================================================
     1. TOKENS (mismos nombres que mockup/index.html y mockup/tira.html)
     ========================================================================== */
  :root {
    --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
    --bg-body: #1e1e1e;
    --bg-sidebar: #252526;
    --bg-surface: #2d2d30;
    --text-primary: #ffffff;
    --text-secondary: #a1a1a6;
    --border-subtle: rgba(255,255,255,0.08);
    --border-medium: rgba(255,255,255,0.16);
    --mac-blue: #0a84ff;
    --mac-blue-subtle: rgba(10,132,255,0.15);
    --mac-green: #30d158;
    --mac-orange: #ff9f0a;
    --radius-sm: 5px;
    --radius-md: 8px;
    /* Escritorio simulado */
    --wallpaper: radial-gradient(900px 500px at 20% 10%, #c3311f 0%, transparent 60%), radial-gradient(800px 600px at 90% 90%, #1d3a6b 0%, transparent 60%), #241c2c;
    --win-bg: #2b2b2f;
    --win-bar: #38383d;
    --win-line: rgba(255,255,255,0.14);
    --win-b-bg: #23303f;
    --glass-fill: rgba(40,40,44,0.74);
    --glass-edge: rgba(255,255,255,0.22);
    --menubar-bg: rgba(30,30,32,0.55);
  }
  [data-theme="light"] {
    --bg-body: #ececec;
    --bg-sidebar: #f6f6f6;
    --bg-surface: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #515154;
    --border-subtle: rgba(0,0,0,0.08);
    --border-medium: rgba(0,0,0,0.16);
    --mac-blue: #0071e3;
    --mac-blue-subtle: rgba(0,113,227,0.12);
    --wallpaper: radial-gradient(900px 500px at 20% 10%, #f3a08f 0%, transparent 60%), radial-gradient(800px 600px at 90% 90%, #9cc0f0 0%, transparent 60%), #efe8f0;
    --win-bg: #ffffff;
    --win-bar: #ececef;
    --win-line: rgba(0,0,0,0.10);
    --win-b-bg: #eef4fc;
    --glass-fill: rgba(250,250,252,0.78);
    --glass-edge: rgba(255,255,255,0.75);
    --menubar-bg: rgba(246,246,246,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: var(--bg-body); color: var(--text-primary);
         display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; font-size: 13px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }

  /* ==========================================================================
     2. PANEL LATERAL DE ESTADOS (herramienta de maqueta, no es UI de la app)
     ========================================================================== */
  aside { background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); padding: 20px 16px; overflow-y: auto; }
  aside h1 { font-size: 15px; margin-bottom: 4px; }
  aside .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; line-height: 1.4; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-secondary); margin: 16px 0 6px; }
  .state-btn { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0;
               color: var(--text-primary); font: inherit; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .state-btn:hover { background: var(--border-subtle); }
  .state-btn.active { background: var(--mac-blue-subtle); color: var(--mac-blue); font-weight: 600; }
  .state-btn .tag { font-size: 12px; color: var(--text-secondary); }
  .toggle { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; }
  .notes { margin-top: 16px; padding: 10px; border-radius: var(--radius-md); background: var(--bg-surface);
           border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 12px; line-height: 1.5; }

  /* ==========================================================================
     3. ESCRITORIO SIMULADO (lo que el usuario ya tiene en pantalla)
     ========================================================================== */
  main { display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
  .screen-wrap { width: 100%; max-width: 1100px; aspect-ratio: 16 / 10; position: relative; }
  .screen { position: absolute; left: 0; top: 0; width: 1000px; height: 625px; transform-origin: 0 0; border-radius: 10px; overflow: hidden;
            background: var(--wallpaper); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .menubar { position: absolute; top: 0; left: 0; right: 0; height: 24px; display: flex; align-items: center; gap: 16px; padding: 0 14px;
             background: var(--menubar-bg); backdrop-filter: blur(20px); font-size: 12px; color: var(--text-primary); z-index: 1; }
  .menubar .spacer { flex: 1; }
  .menubar .status-icon { width: 16px; height: 16px; border-radius: 4px; background: var(--icon-small) center / cover; }
  .win { position: absolute; border-radius: 10px; background: var(--win-bg); box-shadow: 0 18px 40px rgba(0,0,0,.35); overflow: hidden; }
  .win .bar { height: 28px; background: var(--win-bar); display: flex; gap: 7px; align-items: center; padding: 0 11px; }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; display: block; }
  .win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
  .win .viewport { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .win .page { padding: 22px 28px; display: grid; gap: 12px; }
  .win .page b { display: block; height: 10px; border-radius: 5px; background: var(--win-line); }
  .win .page b.h { height: 18px; width: 55%; }
  .win .page b.img { height: 110px; border-radius: 8px; background: linear-gradient(135deg, rgba(232,87,58,.65), rgba(10,132,255,.55)); }
  .win-a { left: 120px; top: 70px; width: 620px; height: 430px; z-index: 2; }
  .win-b { left: 420px; top: 120px; width: 480px; height: 360px; z-index: 1; background: var(--win-b-bg); }
  .dock { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px 12px; border-radius: 18px;
          background: var(--glass-fill); border: 1px solid var(--glass-edge); backdrop-filter: blur(20px); z-index: 1; }
  .dock span { width: 40px; height: 40px; border-radius: 10px; background: var(--win-line); }

  /* ==========================================================================
     4. OVERLAY DE BIENVENIDA (la app real: NSWindow a pantalla completa, sin marco)
     ========================================================================== */
  .ob { position: absolute; inset: 0; z-index: 20; color: #fff; }
  .ob .veil { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  /* Texto directamente sobre el velo, sin tarjeta: zona inferior central */
  .ob .copy { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); width: 560px; text-align: center;
              text-shadow: 0 1px 12px rgba(0,0,0,.55); }
  /* Contraste garantizado aunque el velo se aclare (paso 4) o el fondo del usuario sea blanco */
  .ob .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; pointer-events: none;
               background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 100%); }
  .hi-contrast .ob .scrim { background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.72) 60%, rgba(0,0,0,0) 100%); }
  .ob .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ob .copy h2 { font-size: 26px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 8px; }
  .ob .copy p { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.88); }
  .ob .controls { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 14px; text-shadow: none; }
  .ob .dots { display: flex; gap: 7px; }
  .ob .dots span { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.4); }
  .ob .dots span.on { background: #fff; width: 18px; }
  .ob .btn { font: 600 13px var(--font-family); min-height: 30px; min-width: 76px; padding: 6px 16px; border-radius: 15px; cursor: pointer;
             border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.10); color: #fff; }
  .ob .btn.primary { background: #fff; color: #1d1d1f; border-color: transparent; }
  .ob .pause { position: absolute; bottom: 24px; right: 24px; min-width: 30px; padding: 6px 0; }
  .kbd { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; font: 600 16px var(--font-family);
         background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 3px 0 rgba(255,255,255,.25); color: #fff; }
  .kbd.inline { min-width: 22px; height: 22px; font-size: 12px; border-radius: 5px; padding: 0 5px; box-shadow: 0 2px 0 rgba(255,255,255,.25); vertical-align: 1px; }
  .keys { position: absolute; display: flex; gap: 6px; }
  .hint { position: absolute; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 14px; background: rgba(0,0,0,.55);
          border: 1px solid rgba(255,255,255,.25); white-space: nowrap; }

  /* Cursor fantasma (cruz de captura) y puntero normal */
  .ghost { position: absolute; width: 22px; height: 22px; z-index: 5; }
  .ghost::before, .ghost::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.7); }
  .ghost::before { left: 10px; top: 0; width: 2px; height: 22px; } .ghost::after { top: 10px; left: 0; width: 22px; height: 2px; }
  .arrow { position: absolute; width: 18px; height: 26px; z-index: 5; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

  /* --- Paso 1: icono real + señal en la barra de menús --- */
  .ob-welcome .app-icon { position: absolute; left: 50%; top: 150px; width: 168px; height: 168px; margin-left: -84px;
       background: var(--icon-big) center / contain no-repeat;
       filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); animation: icon-in .8s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes icon-in { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .ob-welcome .ring { position: absolute; top: 1px; left: 0; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #fff;
       box-shadow: 0 0 0 4px rgba(10,132,255,.7); animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.9); opacity: 1 } 100% { transform: scale(1.8); opacity: 0 } }
  .ob-welcome .point { top: 34px; left: 0; transform: translateX(-50%); }

  /* --- Paso 2: permiso --- */
  .perm { position: absolute; left: 50%; top: 190px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
  .perm .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mac-orange); box-shadow: 0 0 0 4px rgba(255,159,10,.25); }
  .perm .dot.ok { background: var(--mac-green); box-shadow: 0 0 0 4px rgba(48,209,88,.25); }
  .perm small { display: block; font-size: 13px; font-weight: 400; color: rgba(255,255,255,.75); margin-top: 4px; }

  /* --- Paso 3: captura directamente sobre la ventana del usuario (bucle 6 s) --- */
  .ob-capture .veil { background: transparent; }
  .ob-capture .sel { position: absolute; left: 230px; top: 150px; border: 2px solid var(--mac-blue); border-radius: 1px;
                     box-shadow: 0 0 0 2000px rgba(0,0,0,.55); animation: cap-sel 6s infinite; }
  @keyframes cap-sel { 0%,18% { width: 0; height: 0; border-color: transparent } 20% { border-color: var(--mac-blue) }
                       50%,58% { width: 300px; height: 170px; border-color: var(--mac-blue) } 60%,100% { width: 300px; height: 170px; border-color: transparent } }
  .ob-capture .ghost { left: 219px; top: 139px; animation: cap-ghost 6s infinite; }
  @keyframes cap-ghost { 0%,16% { transform: translate(0,0) } 50%,100% { transform: translate(300px,170px) } }
  .ob-capture .badge { position: absolute; left: 345px; top: 330px; font: 600 12px "SF Mono", ui-monospace, monospace; padding: 3px 8px; border-radius: 4px;
                       background: rgba(20,20,22,.92); animation: cap-badge 6s infinite; }
  @keyframes cap-badge { 0%,46% { opacity: 0 } 50%,58% { opacity: 1 } 60%,100% { opacity: 0 } }
  .ob-capture .flash { position: absolute; left: 230px; top: 150px; width: 300px; height: 170px; background: #fff; animation: cap-flash 6s infinite; }
  @keyframes cap-flash { 0%,58% { opacity: 0 } 60% { opacity: .85 } 68%,100% { opacity: 0 } }
  .ob-capture .thumb { position: absolute; left: 230px; top: 150px; width: 300px; height: 170px; border-radius: 6px; border: 1px solid rgba(255,255,255,.6);
       background: linear-gradient(135deg, rgba(232,87,58,.8), rgba(10,132,255,.7)); box-shadow: 0 8px 20px rgba(0,0,0,.4); transform-origin: 0 0; animation: cap-fly 6s infinite; }
  @keyframes cap-fly { 0%,60% { opacity: 0; transform: translate(0,0) scale(1) } 62% { opacity: 1 }
                       82%,100% { opacity: 1; transform: translate(240px,-112px) scale(.3) rotate(-4deg) } }
  .ob-capture .rope { position: absolute; left: 300px; right: 300px; top: 40px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.6); animation: cap-rope 6s infinite; }
  @keyframes cap-rope { 0%,60% { opacity: 0 } 66%,100% { opacity: 1 } }
  .ob-capture .keys { left: 50%; top: 70px; transform: translateX(-50%); animation: cap-keys 6s infinite; }
  @keyframes cap-keys { 0%,2% { opacity: 0; transform: translateX(-50%) scale(1) } 5% { opacity: 1 } 8% { transform: translateX(-50%) scale(.9) }
                        11%,30% { opacity: 1; transform: translateX(-50%) scale(1) } 36%,100% { opacity: 0 } }

  /* --- Paso 4: dos dedos = la captura se aparta (bucle 8 s) --- */
  .ob-touch .veil { animation: t-veil 8s infinite; }
  @keyframes t-veil { 0%,10% { background: rgba(0,0,0,.55) } 16%,78% { background: rgba(0,0,0,.08) } 86%,100% { background: rgba(0,0,0,.55) } }
  .ob-touch .fingers { position: absolute; left: 470px; top: 300px; width: 70px; height: 40px; animation: t-fingers 8s infinite; }
  .ob-touch .fingers span { position: absolute; top: 0; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.85);
       box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 4px 12px rgba(0,0,0,.4); }
  .ob-touch .fingers span:nth-child(2) { left: 36px; }
  @keyframes t-fingers { 0%,4% { opacity: 0; transform: scale(1.4) } 8% { opacity: 1; transform: scale(1) } 14% { opacity: 1; transform: translateY(0) }
                         30% { opacity: 1; transform: translateY(-60px) } 34%,100% { opacity: 0; transform: translateY(-60px) } }
  .ob-touch .win-a .page { animation: t-scroll 8s infinite; }
  @keyframes t-scroll { 0%,16% { transform: translateY(0) } 34%,100% { transform: translateY(-150px) } }
  .ob-touch .arrow { left: 520px; top: 330px; animation: t-arrow 8s infinite; }
  @keyframes t-arrow { 0%,36% { transform: translate(0,0) } 50%,100% { transform: translate(60px,-30px) } }
  .ob-touch .hint { left: 50%; transform: translateX(-50%); top: 64px; }
  .ob-touch .h1 { animation: t-h1 8s infinite; } .ob-touch .h2 { animation: t-h2 8s infinite; } .ob-touch .h3 { animation: t-h3 8s infinite; }
  @keyframes t-h1 { 0%,6% { opacity: 0 } 9%,32% { opacity: 1 } 35%,100% { opacity: 0 } }
  @keyframes t-h2 { 0%,36% { opacity: 0 } 39%,62% { opacity: 1 } 65%,100% { opacity: 0 } }
  @keyframes t-h3 { 0%,66% { opacity: 0 } 69%,96% { opacity: 1 } 99%,100% { opacity: 0 } }
  /* La ventana de detrás pasa al frente: «puedes cambiar de app» */
  .screen.touch .win-b { animation: t-front 8s infinite; }
  @keyframes t-front { 0%,44% { z-index: 1 } 46%,100% { z-index: 3 } }
  .screen.touch .win-a .page { animation: t-scroll 8s infinite; }

  /* --- Paso 5: la Tira de verdad, arriba --- */
  .ob-strip .rope { position: absolute; left: 180px; right: 180px; top: 40px; height: 2px; background: rgba(255,255,255,.7); }
  .ob-strip .card { position: absolute; top: 48px; width: 120px; height: 80px; border-radius: 8px; border: 1px solid rgba(255,255,255,.6);
       background: linear-gradient(135deg, rgba(232,87,58,.8), rgba(10,132,255,.7)); box-shadow: 0 10px 24px rgba(0,0,0,.4);
       transform-origin: 50% -10px; animation: sway 3s ease-in-out infinite; }
  .ob-strip .card::before { content: ""; position: absolute; left: 50%; top: -12px; width: 8px; height: 16px; margin-left: -4px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .ob-strip .card:nth-of-type(2n) { animation-delay: -1.5s; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
  .ob-strip .keys { left: 50%; transform: translateX(-50%); top: 170px; }

  /* Reducir movimiento: fotograma explicativo fijo, sin bucles */
  .reduce-motion .ob *, .reduce-motion .screen.touch * { animation: none !important; }
  .reduce-motion .ob-capture .sel { width: 300px; height: 170px; }
  .reduce-motion .ob-capture .ghost { transform: translate(300px,170px); }
  .reduce-motion .ob-capture .flash, .reduce-motion .ob-capture .thumb, .reduce-motion .ob-capture .rope { opacity: 0; }
  .reduce-motion .ob-touch .veil { background: rgba(0,0,0,.08); }
  .reduce-motion .ob-touch .h2, .reduce-motion .ob-touch .h3 { opacity: 0; }

  .hi-contrast .ob .veil { background: rgba(0,0,0,.72); }
  .hi-contrast .ob .btn { border-color: #fff; }

<body>
<aside>
  <h1>Bienvenida inmersiva</h1>
  <p class="sub">Al primer arranque, la bienvenida ocupa la pantalla del usuario: los gestos se ven donde ocurren, sin ventana. Cinco pasos.</p>
  <h2>Pasos</h2>
  <div id="steps"></div>
  <h2>Estados</h2>
  <button class="state-btn" data-state="perm-ok"><span>Permiso ya concedido</span><span class="tag">datos</span></button>
  <button class="state-btn" data-state="perm-restart"><span>Permiso: falta reiniciar</span><span class="tag">error</span></button>
  <button class="state-btn" data-state="closed"><span>Cerrada</span><span class="tag">vacío</span></button>
  <h2>Entorno</h2>
  <label class="toggle"><input type="checkbox" id="t-light"> Apariencia clara</label>
  <label class="toggle"><input type="checkbox" id="t-motion"> Reducir movimiento</label>
  <label class="toggle"><input type="checkbox" id="t-contrast"> Aumentar contraste</label>
  <div class="notes" id="notes"></div>
</aside>

<main>
  <div class="screen-wrap" id="wrap">
    <div class="screen" id="screen">
      <div class="menubar"><strong>Safari</strong><span>Archivo</span><span>Edición</span><span>Visualización</span><span class="spacer"></span><span class="status-icon" aria-label="Screenshooter"></span><span>Wi‑Fi</span><span>dom 11 oct 12:30</span></div>
      <div class="win win-b"><div class="bar"><i></i><i></i><i></i></div><div class="viewport"><div class="page"><b class="h"></b><b></b><b style="width:80%"></b><b></b><b style="width:60%"></b></div></div></div>
      <div class="win win-a"><div class="bar"><i></i><i></i><i></i></div><div class="viewport"><div class="page"><b class="h"></b><b></b><b style="width:85%"></b><b class="img"></b><b></b><b style="width:70%"></b><b></b><b style="width:55%"></b><b class="img"></b><b></b><b style="width:80%"></b><b></b></div></div></div>
      <div class="dock"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div id="slot"></div>
    </div>
  </div>
</main>

<script>
const k = (t, inline) => `<span class="kbd${inline ? ' inline' : ''}">${t}</span>`;
const STEPS = [
  { id: 'welcome', cls: 'ob-welcome', title: 'Te damos la bienvenida a Screenshooter',
    body: 'Captura cualquier zona de la pantalla y tenla al momento en el portapapeles y en la Tira. Vive aquí arriba, en la barra de menús.',
    art: () => `<div class="app-icon" role="img" aria-label="Icono de Screenshooter"></div><span class="ring"></span><div class="hint point">Aquí está</div>`,
    notes: 'Paso 1. Ventana sin marco a pantalla completa sobre el escritorio real, velo 0,55. Icono REAL de la app (NSApp.applicationIconImage) con entrada en muelle. Un anillo pulsante señala el icono de la barra de menús en su posición real (frame del NSStatusItem.button).' },
  { id: 'permission', cls: 'ob-perm', title: 'Permite la grabación de pantalla',
    body: 'macOS necesita tu permiso para que Screenshooter pueda leer la pantalla. Cuando lo actives, Screenshooter se reiniciará una vez y esta bienvenida seguirá donde la dejaste.',
    art: (v) => v === 'ok'
      ? `<div class="perm"><span class="dot ok"></span><div>Grabación de pantalla: permitida</div></div>`
      : v === 'restart'
      ? `<div class="perm"><span class="dot"></span><div>Ya casi está<small>Si ya lo activaste, reinicia Screenshooter para aplicarlo.</small></div></div>`
      : `<div class="perm"><span class="dot"></span><div>Grabación de pantalla: aún no permitida</div></div>`,
    primary: (v) => v === 'ok' ? 'Siguiente' : v === 'restart' ? 'Reiniciar ahora' : 'Abrir Ajustes…',
    secondary: (v) => v === 'ok' ? null : 'Más tarde',
    notes: 'Paso 2. Si el permiso ya está, se ve en verde y el botón es «Siguiente». Si falta: «Abrir Ajustes…» (CGRequestScreenCaptureAccess una vez + deep link) y «Más tarde». Al volver a la app tras abrir Ajustes, el botón pasa a «Reiniciar ahora» (TCC exige reinicio); se guarda el paso 3 para reanudar. El velo baja de nivel (.normal) mientras Ajustes está delante para no taparlo.' },
  { id: 'capture', cls: 'ob-capture', title: 'Pulsa ⌥⌘S y arrastra',
    body: `Selecciona lo que quieras, como aquí. Cada captura se copia y se cuelga en la Tira; puedes hacer varias seguidas hasta pulsar ${k('esc', true)}.`,
    art: () => `<div class="keys">${k('⌥')}${k('⌘')}${k('S')}</div><div class="sel"></div><div class="badge">300 × 170</div><div class="flash"></div><div class="ghost"></div><div class="rope"></div><div class="thumb"></div>`,
    notes: 'Paso 3. Demostración SOBRE la pantalla real: aparecen las teclas, la cruz fantasma arrastra una selección en el centro (el velo se recorta como en la captura de verdad), destello, y la miniatura vuela hasta donde vive la Tira. Bucle 6 s, máx. 3 repeticiones y luego fotograma fijo. No captura nada de verdad.' },
  { id: 'touch', cls: 'ob-touch', title: 'Toca con dos dedos para apartarla',
    body: 'Con la captura activa, toca el trackpad con dos dedos: la pantalla se aclara y puedes hacer scroll o cambiar de app. Si no haces nada, vuelve sola en un momento.',
    art: () => `<div class="fingers"><span></span><span></span></div><svg class="arrow" viewBox="0 0 18 26" aria-hidden="true"><path d="M1.5 1.5 L1.5 20.5 L6.2 16.2 L9.4 23.6 L12.6 22.2 L9.5 15 L15.8 15 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div class="hint h1">Dos dedos: la captura se aparta</div><div class="hint h2">Haz scroll o cambia de app</div><div class="hint h3">Sin tocar nada, vuelve sola</div>`,
    screenCls: 'touch',
    notes: 'Paso 4 (sustituye a «Scroll» y «Navegar»: el usuario descubrió que el toque de dos dedos basta y es más natural que ⌥⌘S). Bucle 8 s: dos huellas aparecen junto al puntero, el velo se aclara, la página de la ventana real se desplaza, la ventana de detrás pasa al frente y al final vuelve el velo. ⌥⌘S para navegar sigue existiendo pero no se enseña.' },
  { id: 'strip', cls: 'ob-strip', title: 'Todo queda en la Tira',
    body: `Tus capturas cuelgan aquí arriba. Arrástralas a cualquier app, haz clic para copiar o pulsa ${k('⌃',1)}${k('⌥',1)}${k('T',1)} para mostrarla u ocultarla.`,
    art: () => `<div class="rope"></div>${[260,410,560,710].map(x => `<div class="card" style="left:${x - 60}px"></div>`).join('')}`,
    last: true,
    notes: 'Paso 5. En la app real se despliega la Tira de verdad (StripManager.peek) en su sitio; si está vacía, tarjetas de ejemplo que se retiran al cerrar. «Empezar» cierra y guarda onboardingVersion = 1.' },
];
const EXTRA = {
  'perm-ok': { step: 'permission', variant: 'ok' },
  'perm-restart': { step: 'permission', variant: 'restart' },
  closed: { notes: 'Cerrada: queda el escritorio tal cual. Se vuelve a abrir desde «Cómo funciona…» en el menú de la barra (empieza en el paso 3 si el permiso ya está).' },
};

const stepsBox = document.getElementById('steps');
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'state-btn'; b.dataset.state = s.id;
  b.innerHTML = `<span>${i + 1}. ${s.title}</span><span class="tag">paso</span>`;
  stepsBox.appendChild(b);
});
document.querySelectorAll('.state-btn').forEach(b => b.addEventListener('click', () => show(b.dataset.state)));

let current = 'welcome';
function show(id) {
  current = id;
  const ex = EXTRA[id];
  const stepId = ex && ex.step ? ex.step : id;
  const variant = ex && ex.variant;
  const idx = STEPS.findIndex(s => s.id === stepId);
  const screen = document.getElementById('screen');
  const slot = document.getElementById('slot');
  screen.classList.remove('touch', 'paused-touch');
  document.querySelectorAll('.state-btn').forEach(b => b.classList.toggle('active', b.dataset.state === id));
  if (idx < 0) { slot.innerHTML = ''; document.getElementById('notes').textContent = ex.notes; return; }
  const s = STEPS[idx];
  if (s.screenCls) screen.classList.add(s.screenCls);
  const dots = STEPS.map((_, j) => `<span class="${j === idx ? 'on' : ''}"></span>`).join('');
  const primary = s.primary ? s.primary(variant) : (s.last ? 'Empezar' : 'Siguiente');
  const secondary = s.secondary ? s.secondary(variant) : null;
  const animated = ['capture', 'touch', 'welcome'].includes(s.id);
  slot.innerHTML = `<div class="ob ${s.cls}" role="dialog" aria-label="Bienvenida a Screenshooter">
      <div class="veil"></div>${s.art(variant)}<div class="scrim"></div>
      ${animated ? '<button class="btn pause" aria-label="Pausar animación" data-go="pause">❚❚</button>' : ''}
      <div class="copy"><h2>${s.title}</h2><p>${s.body}</p>
        <div class="controls">
          <button class="btn" data-go="closed">Saltar</button>
          ${idx > 0 ? '<button class="btn" data-go="prev">Atrás</button>' : ''}
          <div class="dots" role="img" aria-label="Paso ${idx + 1} de ${STEPS.length}">${dots}</div>
          ${secondary ? `<button class="btn" data-go="next">${secondary}</button>` : ''}
          <button class="btn primary" data-go="${s.last ? 'closed' : (variant === 'restart' ? 'capture' : 'next')}">${primary}</button>
        </div></div></div>`;
  document.getElementById('notes').textContent = s.notes;
  // Anillo y etiqueta sobre la posición real del icono de la barra de menús
  const icon = screen.querySelector('.status-icon');
  const cx = icon.offsetLeft + icon.offsetWidth / 2;
  slot.querySelectorAll('.ring').forEach(r => r.style.left = (cx - 11) + 'px');
  slot.querySelectorAll('.point').forEach(p => p.style.left = cx + 'px');
  slot.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const go = b.dataset.go;
    if (go === 'next') show(STEPS[idx + 1].id);
    else if (go === 'prev') show(STEPS[idx - 1].id);
    else if (go === 'pause') {
      const ob = slot.querySelector('.ob'); ob.classList.toggle('paused'); screen.classList.toggle('paused-touch');
      const p = ob.classList.contains('paused'); b.textContent = p ? '▶' : '❚❚'; b.setAttribute('aria-label', p ? 'Reproducir animación' : 'Pausar animación');
    } else show(go);
  }));
  slot.querySelector('.btn.primary').focus({ preventScroll: true });
}

document.addEventListener('keydown', e => {
  const idx = STEPS.findIndex(s => s.id === current);
  if (e.key === 'Escape' && idx >= 0) show('closed');
});
function fit() {
  const wrap = document.getElementById('wrap');
  document.getElementById('screen').style.transform = `scale(${wrap.clientWidth / 1000})`;
}
addEventListener('resize', fit); fit();
const root = document.documentElement;
document.getElementById('t-light').addEventListener('change', e => root.dataset.theme = e.target.checked ? 'light' : 'dark');
document.getElementById('t-motion').addEventListener('change', e => document.body.classList.toggle('reduce-motion', e.target.checked));
document.getElementById('t-contrast').addEventListener('change', e => document.body.classList.toggle('hi-contrast', e.target.checked));
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { document.getElementById('t-motion').checked = true; document.body.classList.add('reduce-motion'); }
show('welcome');
</script>
</body>
</html>
